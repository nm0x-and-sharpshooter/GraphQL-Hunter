<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GraphQL Hunter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="shell">

    <!-- ── Header ─────────────────────────────────────────────────────── -->
    <header class="header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M12 2L3 7v10l9 5 9-5V7L12 2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M12 2v20M3 7l9 5 9-5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
        <span class="brand-name">GraphQL Hunter</span>
        <span class="version-badge">v0.1</span>
      </div>
      <div class="status-pill" id="status-pill">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-label" id="status-label">Hunting</span>
      </div>
    </header>

    <!-- ── Stats row ──────────────────────────────────────────────────── -->
    <section class="stats-row" aria-label="Request statistics">
      <div class="stat-card">
        <span class="stat-num" id="stat-total">0</span>
        <span class="stat-desc">Captured</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-card">
        <span class="stat-num" id="stat-endpoints">0</span>
        <span class="stat-desc">Endpoints</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-card accent-mutation">
        <span class="stat-num" id="stat-mutations">0</span>
        <span class="stat-desc">Mutations</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-card accent-batch">
        <span class="stat-num" id="stat-batch">0</span>
        <span class="stat-desc">Batched</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-card accent-risk">
        <span class="stat-num" id="stat-risks">0</span>
        <span class="stat-desc">Risks</span>
      </div>
    </section>

    <!-- ── Tab bar ──────────────────────────────────────────────────────── -->
    <nav class="tab-bar" role="tablist" aria-label="Views">
      <button class="tab-btn active" id="tab-traffic" role="tab"
              aria-selected="true" aria-controls="panel-traffic">
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M2 4h12M2 8h8M2 12h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Traffic
      </button>
      <button class="tab-btn" id="tab-schema" role="tab"
              aria-selected="false" aria-controls="panel-schema">
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="2" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/>
          <rect x="9" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/>
          <path d="M4.5 7v2h7V7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Schema
        <span class="tab-badge" id="schema-type-count">0</span>
      </button>
    </nav>

    <!-- ── Traffic panel ─────────────────────────────────────────────────── -->
    <section class="tab-panel" id="panel-traffic" role="tabpanel" aria-labelledby="tab-traffic">
      <div class="feed-header">
        <span class="feed-title">Recent Traffic</span>
        <button class="btn-ghost" id="btn-clear" title="Clear all captured data">Clear</button>
      </div>

      <div class="feed" id="feed" role="list">
        <!-- Populated by popup.ts -->
        <div class="empty-state" id="empty-state">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="2"/>
            <path d="M24 4L12 14.5 6.5 27.5l5 10.5H36.5l5-10.5L36 14.5 24 4z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M24 4v40M6.5 27.5h35M12 14.5l12 13 12-13M17 38l7-10.5 7 10.5" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
          </svg>
          <p>Browse a GraphQL-powered app<br/>to start intercepting traffic</p>
        </div>
      </div>
    </section>

    <!-- ── Schema panel ───────────────────────────────────────────────────── -->
    <section class="tab-panel hidden" id="panel-schema" role="tabpanel" aria-labelledby="tab-schema">
      <div class="feed-header">
        <span class="feed-title">Discovered Schema</span>
        <button class="btn-ghost" id="btn-clear-schema" title="Clear schema model">Clear</button>
      </div>

      <!-- Schema empty state -->
      <div class="empty-state" id="schema-empty">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="4" y="4" width="14" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
          <rect x="30" y="30" width="14" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
          <path d="M11 18v6h26v-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p>Schema will be reconstructed<br/>as you capture GraphQL traffic</p>
      </div>

      <!-- Schema stats bar -->
      <div class="schema-stats" id="schema-stats" style="display:none">
        <span class="schema-stat"><strong id="schema-stat-types">0</strong> types</span>
        <span class="schema-stat-divider">·</span>
        <span class="schema-stat"><strong id="schema-stat-fields">0</strong> fields</span>
        <span class="schema-stat-divider">·</span>
        <span class="schema-stat"><strong id="schema-stat-endpoints">0</strong> endpoints</span>
      </div>

      <!-- Type tree (populated by popup.ts) -->
      <div class="schema-tree" id="schema-tree" aria-label="Discovered types"></div>

      <!-- Endpoint list -->
      <div class="schema-endpoints" id="schema-endpoints" style="display:none">
        <div class="schema-section-title">Observed Endpoints</div>
        <ul class="endpoint-list" id="endpoint-list" aria-label="GraphQL endpoints"></ul>
      </div>
    </section>

    <!-- ── Footer ─────────────────────────────────────────────────────── -->
    <footer class="footer">
      <button class="btn-primary" id="btn-dashboard">
        Open Full Dashboard
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </footer>

  </div>
  <script src="popup.js"></script>
</body>
</html>
